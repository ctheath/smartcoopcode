[location]
# Replace these with the coop's actual coordinates.
latitude = 40.0000
longitude = -105.0000
timezone = America/Denver

[schedule]
# Open at exact sunrise and close 30 minutes after sunset.
open_offset_minutes = 0
close_offset_minutes = 30

[hardware]
in1_pin = 17
in2_pin = 27
reed_open_pin = 22
reed_closed_pin = 23
motor_timeout_seconds = 30
motor_poll_seconds = 0.1
# open_stop_mode can be brake_hold, brake_pulse, or coast.
# close_stop_mode can be brake_hold, brake_pulse, or coast.
open_stop_mode = brake_hold
close_stop_mode = coast
brake_pulse_seconds = 1.0

[runtime]
# If the Pi boots with an obviously stale clock, wait instead of moving the door.
min_valid_date = 2024-01-01
invalid_time_retry_seconds = 60
max_sleep_seconds = 3600
state_file = /var/lib/coop-door/state.json

[run_door]
# Presence of this section enables the run door. Remove it to disable.
# in1/in2 are wired to the L298N's IN3/IN4 (channel B).
in1_pin = 5
in2_pin = 6
reed_closed_pin = 24
# Full stroke is ~55s through the L298N; 75 leaves margin.
travel_seconds = 75
# Actual open time = later of this and sunrise.
open_time = 07:00
# Minutes after sunset - keep at [schedule] close_offset_minutes + 5.
close_offset_minutes = 35
# state_file defaults to run_door_state.json next to the runtime state_file.
