[location]
# Replace these with the coop's actual coordinates.
latitude = 40.0000
longitude = -105.0000
timezone = America/Denver

[schedule]
# Open at exact sunrise and close 30 minutes after sunset.
open_offset_minutes = 0
close_offset_minutes = 30

[hardware]
in1_pin = 17
in2_pin = 27
reed_open_pin = 22
reed_closed_pin = 23
# Full open/close travel is ~4s; anything longer means a missed reed, and
# running past it strains the motor.
motor_timeout_seconds = 5.5
# Optional separate limit for closing. The door can't be higher than
# motor_timeout_seconds of lifting, and it comes down no slower than it went
# up, so motor_timeout_seconds + 1 is the bound. Keeping it tight matters: if
# the closed reed ever fails, this is what stops the motor paying out slack
# string. Unset means the same value as motor_timeout_seconds.
# close_timeout_seconds = 6.5
motor_poll_seconds = 0.1
# The brake can't hold the door against gravity, so an open door sometimes
# slides right back down. After an open reaches the reed, wait this long,
# re-check the open reed, and pulse open again up to max_reopen_attempts
# times (0 disables). Closes, and opens that time out, are never retried.
reopen_check_seconds = 2.0
max_reopen_attempts = 1
# open_stop_mode can be brake_hold, brake_pulse, or coast.
# close_stop_mode can be brake_hold, brake_pulse, or coast.
open_stop_mode = brake_hold
close_stop_mode = coast
brake_pulse_seconds = 1.0

[runtime]
# If the Pi boots with an obviously stale clock, wait instead of moving the door.
min_valid_date = 2024-01-01
invalid_time_retry_seconds = 60
max_sleep_seconds = 3600
state_file = /var/lib/coop-door/state.json
# Every motor move is appended here as one JSON line (what ended it, how long
# it ran, what every reed read before and after). `coop_door.py diagnose`
# reads it back. Defaults to events.jsonl next to state_file.
# event_log = /var/lib/coop-door/events.jsonl

[notify]
# Optional. Any URL that accepts a plain-text POST; an ntfy.sh topic works
# out of the box (install the ntfy app, subscribe to the topic). A message is
# sent whenever a move ends unverified, and by `diagnose --notify` when it
# finds a problem. Leave unset to disable.
# url = https://ntfy.sh/your-private-coop-topic

[run_door]
# Presence of this section enables the run door. Remove it to disable.
# in1/in2 are wired to the L298N's IN3/IN4 (channel B).
in1_pin = 5
in2_pin = 6
reed_closed_pin = 24
# Close drive window. Size it to cover a FULL stroke from any rod position
# (full stroke takes ~25-55s depending on unit speed); the actuator's internal
# retract limit switch is what actually stops the close.
travel_seconds = 75
# Optional: cap the open drive when the door reaches fully-open before the rod
# runs out of stroke (timed stop; measure your door's swing and subtract ~1s).
# open_travel_seconds = 18
# Actual open time = later of this and sunrise.
open_time = 07:00
# Minutes after sunset - keep at [schedule] close_offset_minutes + 5.
close_offset_minutes = 35
# state_file defaults to run_door_state.json next to the runtime state_file.
